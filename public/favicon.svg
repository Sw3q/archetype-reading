<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A miniature of the app's roundtable: black table, gold rings, jewel seats, gold "You". -->
  <circle cx="32" cy="32" r="31" fill="#0d0a08" stroke="rgba(201,163,90,0.6)" stroke-width="2"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(201,163,90,0.35)" stroke-width="2"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="rgba(201,163,90,0.2)" stroke-width="2"/>
  <!-- Archetype seats around the upper arc (family jewel tones) -->
  <circle cx="12" cy="32" r="4.5" fill="#b25a42"/>
  <circle cx="17.9" cy="17.9" r="4.5" fill="#b06179"/>
  <circle cx="32" cy="12" r="4.5" fill="#9a72c4"/>
  <circle cx="46.1" cy="17.9" r="4.5" fill="#4a9a9c"/>
  <circle cx="52" cy="32" r="4.5" fill="#5aa276"/>
  <!-- You, at the bottom of the table -->
  <circle cx="32" cy="48" r="6" fill="#ecd296"/>
</svg>
